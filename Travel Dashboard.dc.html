<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="ext-resource-dependency" content="idcube-mark.png" data-resource-id="idcubeMark" />
<script src="travel-data.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:#EEF1F5;color:#0F1B2D;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  img,svg{max-width:100%;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#C7CFDB;border-radius:6px;border:2px solid #EEF1F5;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ===== entrance / chart motion ===== */
  @keyframes fadeUp{from{transform:translateY(22px);}to{transform:translateY(0);}}
  @keyframes growX{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  @keyframes growY{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  @keyframes drawArc{from{stroke-dasharray:0 var(--cc);}to{stroke-dasharray:var(--len) var(--rest);}}
  @keyframes popIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
  @keyframes sheen{from{left:-60%;}to{left:130%;}}

  /* cards: lift + sheen sweep */
  [data-card]{position:relative;overflow:hidden;transition:transform .32s cubic-bezier(.22,.7,.2,1), box-shadow .32s ease;will-change:transform;}
  [data-card]:hover{transform:translateY(-5px);box-shadow:0 22px 50px rgba(16,27,45,.16);}
  [data-card]::before{content:'';position:absolute;top:0;left:-60%;width:55%;height:100%;background:linear-gradient(105deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.5) 50%, rgba(255,255,255,0) 100%);transform:skewX(-18deg);opacity:0;pointer-events:none;z-index:3;}
  [data-card]:hover::before{opacity:1;animation:sheen .85s ease;}
  [data-kpi]::after{content:'';position:absolute;inset:0;border-radius:16px;background:radial-gradient(130% 130% at 100% 0%, rgba(255,255,255,.6), rgba(255,255,255,0) 45%);opacity:0;transition:opacity .3s ease;pointer-events:none;}
  [data-kpi]:hover::after{opacity:1;}

  /* ===== animated background ===== */
  @keyframes drift1{0%{transform:translate(0,0) scale(1);}50%{transform:translate(70px,46px) scale(1.12);}100%{transform:translate(0,0) scale(1);}}
  @keyframes drift2{0%{transform:translate(0,0) scale(1);}50%{transform:translate(-80px,54px) scale(1.1);}100%{transform:translate(0,0) scale(1);}}
  @keyframes drift3{0%{transform:translate(0,0) scale(1);}50%{transform:translate(46px,-60px) scale(1.14);}100%{transform:translate(0,0) scale(1);}}
  @keyframes gridDrift{from{background-position:0 0,0 0;}to{background-position:46px 46px,46px 46px;}}
  .bg-field{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .aurora{position:absolute;border-radius:50%;filter:blur(64px);will-change:transform;}
  .bg-grid{position:absolute;inset:-2px;background-image:linear-gradient(rgba(15,27,45,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(15,27,45,.045) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(125% 95% at 50% 0%, #000 28%, transparent 80%);mask-image:radial-gradient(125% 95% at 50% 0%, #000 28%, transparent 80%);animation:gridDrift 38s linear infinite;}
  .bg-vignette{position:absolute;inset:0;background:radial-gradient(135% 115% at 50% -12%, transparent 52%, rgba(15,27,45,.06) 100%);}

  /* ===== branded intro ===== */
  @keyframes introLogo{0%{opacity:0;transform:scale(.6) translateY(10px);}60%{opacity:1;}100%{opacity:1;transform:scale(1) translateY(0);}}
  @keyframes introGlow{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 26px 70px rgba(79,70,229,.42);}50%{box-shadow:0 0 0 1px rgba(255,255,255,.2), 0 26px 92px rgba(13,148,136,.55);}}
  @keyframes introWord{from{opacity:0;transform:translateY(14px);letter-spacing:.12em;}to{opacity:1;transform:translateY(0);letter-spacing:-.02em;}}
  @keyframes introFade{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  @keyframes introLine{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  @keyframes introOrb{0%{transform:translate(0,0);}50%{transform:translate(34px,-28px);}100%{transform:translate(0,0);}}
  .intro-logo{animation:introLogo .7s cubic-bezier(.2,.8,.2,1) both, introGlow 2.4s ease-in-out infinite .7s;}
  .intro-word{animation:introWord .6s cubic-bezier(.2,.8,.2,1) .25s both;}
  .intro-sub{animation:introFade .6s ease .45s both;}
  .intro-line{animation:introLine .7s cubic-bezier(.7,0,.2,1) .55s both;}
  .intro-tag{animation:introFade .6s ease .72s both;}
  .intro-orb{position:absolute;border-radius:50%;filter:blur(54px);animation:introOrb 7s ease-in-out infinite;}

  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
</style>
</helmet>
<div class="bg-field" aria-hidden="true">
  <div class="aurora" style="top:-190px;left:-70px;width:640px;height:640px;background:radial-gradient(circle at 30% 30%, rgba(79,70,229,.20), rgba(79,70,229,0) 68%);animation:drift1 26s ease-in-out infinite;"></div>
  <div class="aurora" style="bottom:-230px;left:34%;width:700px;height:700px;background:radial-gradient(circle at 30% 30%, rgba(13,148,136,.17), rgba(13,148,136,0) 68%);animation:drift2 31s ease-in-out infinite;"></div>
  <div class="aurora" style="top:6%;right:-170px;width:580px;height:580px;background:radial-gradient(circle at 30% 30%, rgba(245,158,11,.14), rgba(245,158,11,0) 68%);animation:drift3 28s ease-in-out infinite;"></div>
  <div class="aurora" style="bottom:10%;right:14%;width:440px;height:440px;background:radial-gradient(circle at 30% 30%, rgba(139,92,246,.12), rgba(139,92,246,0) 70%);animation:drift1 34s ease-in-out infinite reverse;"></div>
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>
</div>
<div style="position:relative;z-index:1;min-height:100%;">{{ app }}</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const C = {
  bg:'#EEF1F5', side:'#0E1726', sideHi:'#16233A', card:'#FFFFFF',
  ink:'#0F1B2D', muted:'#6B7787', faint:'#9AA6B5', border:'#E6EAF0', track:'#EEF1F5',
  flight:'#4F46E5', hotel:'#0D9488', accent:'#F59E0B',
  cat:['#4F46E5','#0D9488','#F59E0B','#F43F5E','#8B5CF6','#0EA5E9','#10B981','#EC4899','#F97316','#0E7490','#6366F1','#64748B'],
  mono:"'IBM Plex Mono',monospace"
};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

class Component extends DCLogic {
  state = { view:'overview', months:[], scope:'all', query:'', monthOpen:false, scrolled:false, cw:0, tSort:'total', cSort:'total', xSort:'expense', ready:!!(window.MMT_DATA), vw: (typeof window!=='undefined'?window.innerWidth:1200), tip:null, revealed:false, exit:false, introGone:false };

  componentDidMount(){
    this._introStart=(typeof performance!=='undefined'?performance.now():Date.now());
    this._reduce=(typeof matchMedia!=='undefined') && matchMedia('(prefers-reduced-motion: reduce)').matches;
    this._onResize = () => { const w=window.innerWidth; if((w<860)!==(this.state.vw<860)||Math.abs(w-this.state.vw)>40) this.setState({vw:w}); };
    window.addEventListener('resize', this._onResize);
    // capture:true also catches scroll on the embedding scroll container (scroll events don't bubble)
    this._onScroll = (e) => { if(this.state.tip) this.setState({tip:null});
      const t=e&&e.target, st=(t&&t.nodeType===1&&t.scrollTop!=null)?t.scrollTop:(window.scrollY||document.documentElement.scrollTop||0);
      const s=st>6; if(s!==this.state.scrolled) this.setState({scrolled:s}); };
    window.addEventListener('scroll', this._onScroll, {passive:true, capture:true});
    // reconcile to the real viewport — the field-initializer vw can be stale in embeds/iframes that settle their size after construction
    const syncVw=()=>{ this.setState({vw: window.innerWidth || this.state.vw}); };
    requestAnimationFrame(syncVw); setTimeout(syncVw,180); setTimeout(syncVw,600);
    // ResizeObserver reliably catches the post-load iframe sizing that fixed-delay timeouts miss
    if(typeof ResizeObserver!=='undefined'){ this._ro=new ResizeObserver(syncVw); try{ this._ro.observe(document.documentElement); }catch(e){} }
    if(window.MMT_DATA){ this.setState({ready:true}); return; }
    // Poll for the global injected by the travel-data.js script (works on file:// where fetch is blocked)
    let tries=0;
    this._poll = setInterval(()=>{
      tries++;
      if(window.MMT_DATA){ clearInterval(this._poll); this.setState({ready:true}); return; }
      if(tries>40){ // ~6s — fall back to fetch (works when served over http)
        clearInterval(this._poll);
        fetch('travel-data.js').then(r=>r.text()).then(t=>{
          const i=t.indexOf('='); const json=t.slice(i+1).replace(/;\s*$/,'');
          window.MMT_DATA=JSON.parse(json);
          this.setState({ready:true});
        }).catch(e=>{ console.error('data load failed',e); });
      }
    },150);
  }
  componentWillUnmount(){ if(this._onResize) window.removeEventListener('resize', this._onResize); if(this._onScroll) window.removeEventListener('scroll', this._onScroll, {capture:true}); if(this._cro) this._cro.disconnect(); if(this._poll) clearInterval(this._poll); if(this._ro) this._ro.disconnect(); [this._t1,this._t2,this._t3].forEach(t=>t&&clearTimeout(t)); }

  // ===== cinematic boot + count-up engine =====
  componentDidUpdate(){ if(this.state.ready) this.scheduleReveal(); this.runCountUps(); }
  setRoot=(n)=>{
    if(!n || n===this._root) return;
    this._root=n;
    if(typeof ResizeObserver!=='undefined'){
      if(this._cro) this._cro.disconnect();
      this._cro=new ResizeObserver(es=>{ const w=Math.round(es[0].contentRect.width);
        if(w>0 && ((w<860)!==(this.state.cw<860) || Math.abs(w-(this.state.cw||0))>40)) this.setState({cw:w}); });
      this._cro.observe(n);
    }
  };
  scheduleReveal(){
    if(this._revScheduled) return; this._revScheduled=true;
    if(this._reduce){ this.setState({revealed:true,exit:true,introGone:true}); return; }
    const now=(typeof performance!=='undefined'?performance.now():Date.now());
    const wait=Math.max(0, 1400-(now-(this._introStart||now)));
    this._t1=setTimeout(()=>this.setState({revealed:true}), wait);
    this._t2=setTimeout(()=>this.setState({exit:true}), wait+180);
    this._t3=setTimeout(()=>this.setState({introGone:true}), wait+1060);
  }
  skipIntro(){ if(this.state.introGone) return; [this._t1,this._t2,this._t3].forEach(t=>t&&clearTimeout(t)); this.setState({revealed:true,exit:true}); setTimeout(()=>this.setState({introGone:true}),700); }
  animSig(){ return this.state.view+'|'+this.monthSel().join(',')+'|'+this.state.scope+'|'+(this.state.query||''); }
  runCountUps(){
    if(this._reduce || !this.state.revealed || typeof document==='undefined') return;
    const sig=this.animSig(); if(sig===this._cuSig) return; this._cuSig=sig;
    const root=this._root||document; const nodes=root.querySelectorAll('[data-cu]');
    for(let i=0;i<nodes.length;i++) this.countUp(nodes[i]);
  }
  countUp(node){
    const txt=node.textContent; const m=txt.match(/-?\d[\d,]*(\.\d+)?/); if(!m) return;
    const numStr=m[0], pre=txt.slice(0,m.index), suf=txt.slice(m.index+numStr.length);
    const hasComma=numStr.indexOf(',')>=0, dot=numStr.indexOf('.'), dec=dot>=0?numStr.length-dot-1:0;
    const target=parseFloat(numStr.replace(/,/g,'')); if(!isFinite(target)) return;
    if(node._cuRaf) cancelAnimationFrame(node._cuRaf); if(node._cuTo) clearTimeout(node._cuTo);
    const dur=1050, t0=(typeof performance!=='undefined'?performance.now():Date.now());
    const fmt=(v)=>{ const neg=v<0; v=Math.abs(v); let s=v.toFixed(dec), ip=s, fp=''; const di=s.indexOf('.'); if(di>=0){ ip=s.slice(0,di); fp=s.slice(di); } if(hasComma){ let l3=ip.slice(-3), rest=ip.slice(0,-3); rest=rest.replace(/\B(?=(\d{2})+(?!\d))/g,','); ip=(rest?rest+',':'')+l3; } return (neg?'-':'')+ip+fp; };
    const ease=(t)=>1-Math.pow(1-t,3);
    const tick=(nw)=>{ let p=(nw-t0)/dur; if(p>1)p=1; node.textContent=pre+fmt(target*ease(p))+suf; if(p<1){ node._cuRaf=requestAnimationFrame(tick); } else { node.textContent=txt; node._cuRaf=null; } };
    node.textContent=txt;
    node._cuRaf=requestAnimationFrame(()=>{ node.textContent=pre+fmt(0)+suf; node._cuRaf=requestAnimationFrame(tick); });
    node._cuTo=setTimeout(()=>{ if(node._cuRaf){ cancelAnimationFrame(node._cuRaf); node._cuRaf=null; } node.textContent=txt; }, dur+260);
  }
  renderIntro(){
    if(this.state.introGone) return null;
    const h=React.createElement; const logo=(window.__resources&&window.__resources.idcubeMark)||'idcube-mark.png';
    return h('div',{onClick:()=>this.skipIntro(),
      style:{position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',
        background:'radial-gradient(125% 120% at 50% 28%, #19294A 0%, #0E1726 56%, #080D18 100%)',
        transform:this.state.exit?'translateY(-102%)':'translateY(0)',
        transition:'transform .85s cubic-bezier(.7,0,.18,1)',overflow:'hidden'}},
      h('div',{className:'intro-orb',style:{top:'16%',left:'20%',width:300,height:300,background:'radial-gradient(circle,rgba(79,70,229,.5),transparent 70%)'}}),
      h('div',{className:'intro-orb',style:{bottom:'14%',right:'18%',width:340,height:340,background:'radial-gradient(circle,rgba(13,148,136,.42),transparent 70%)',animationDelay:'1.6s'}}),
      h('div',{style:{position:'relative',textAlign:'center',color:'#fff',padding:20}},
        h('div',{className:'intro-logo',style:{width:88,height:88,margin:'0 auto 24px',borderRadius:22,background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',padding:13,boxSizing:'border-box'}},
          h('img',{src:logo,alt:'IDCUBE',style:{width:'100%',height:'100%',objectFit:'contain',display:'block'}})),
        h('div',{className:'intro-word',style:{fontSize:36,fontWeight:700,letterSpacing:'-.02em',lineHeight:1}},'IDCUBE'),
        h('div',{className:'intro-sub',style:{fontSize:12,letterSpacing:'.46em',textTransform:'uppercase',color:'#9AA8BC',marginTop:10,paddingLeft:'.46em'}},'Travel Spend Analyser'),
        h('div',{style:{display:'flex',justifyContent:'center'}},
          h('div',{className:'intro-line',style:{height:2,width:170,marginTop:28,background:'linear-gradient(90deg,#4F46E5,#0D9488,#F59E0B)',borderRadius:2,transformOrigin:'left'}})),
        h('div',{className:'intro-tag',style:{fontSize:11.5,color:'#5E6C82',marginTop:20,letterSpacing:'.05em'}},'Preparing your travel spend intelligence\u2026')
      )
    );
  }

  // stagger entrance: clone the view's top-level rows with incremental fade-up delays
  animate(el){
    if(!el||!React.isValidElement(el)||!el.props||el.props.children==null) return el;
    const kids=React.Children.toArray(el.props.children);
    const out=kids.map((k,i)=> React.isValidElement(k)
      ? React.cloneElement(k,{style:Object.assign({},k.props.style,{animation:'fadeUp .62s cubic-bezier(.22,.7,.2,1) both',animationDelay:(i*85)+'ms'})})
      : k);
    return React.cloneElement(el, {}, out);
  }

  vwLive(){
    const cw=this.state.cw; if(cw) return cw;
    const el=this._root && this._root.parentNode, pw=el && el.clientWidth;
    if(pw) return pw;
    return (typeof window!=='undefined' && window.innerWidth) ? window.innerWidth : this.state.vw;
  }
  mob(){ return this.vwLive() < 860; }
  gx(desktop){ return this.mob() ? '1fr' : desktop; }

  // ---------- data ----------
  raw(){ const d=window.MMT_DATA||{}; return {flight:d.flight||[],hotel:d.hotel||[],train:d.train||[],wallet:d.wallet||[],actions:d.actions||{flight:[],hotel:[],train:[]}}; }
  monthSel(){ return this.state.months||[]; }
  inMonths(x){ const ms=this.monthSel(); return ms.length===0 || (x.created && ms.includes(x.created.slice(0,7))); }
  q(){ return (this.state.query||'').trim().toLowerCase(); }
  matchQ(rec, fields){ const q=this.q(); if(!q) return true; return fields.some(v=>{ if(v==null)return false; if(Array.isArray(v))return v.some(x=>String(x).toLowerCase().includes(q)); return String(v).toLowerCase().includes(q); }); }
  filtered(){
    const {scope}=this.state; const d=this.raw();
    let flight=d.flight.filter(x=>this.inMonths(x)), hotel=d.hotel.filter(x=>this.inMonths(x)), train=d.train.filter(x=>this.inMonths(x));
    if(scope==='dom'){ flight=flight.filter(f=>f.type==='Dom'); hotel=hotel.filter(h=>!h.intl); }
    if(scope==='intl'){ flight=flight.filter(f=>f.type==='Intl'); hotel=hotel.filter(h=>h.intl); }
    // global search
    flight=flight.filter(f=>this.matchQ(f,[f.traveller,f.travellers,f.airline,f.bookingId,f.pnr,f.ticket,f.from,f.to]));
    hotel=hotel.filter(x=>this.matchQ(x,[x.guest,x.guests,x.hotel,x.bookingId,x.pnr,x.city,x.country]));
    train=train.filter(t=>this.matchQ(t,[t.traveller,t.travellers,t.trainName,t.bookingId,t.pnr,t.from,t.to]));
    return {flight,hotel,train};
  }
  months(){ const s=new Set(); const d=this.raw(); d.flight.concat(d.hotel,d.train).forEach(x=>{ if(x.created) s.add(x.created.slice(0,7)); }); return [...s].sort(); }
  fyOf(ym){ const y=+ym.slice(0,4), m=+ym.slice(5,7); return String(m>=4?y:y-1); }
  fyLabel(fy){ fy=+fy; return 'FY '+fy+'-'+String(fy+1).slice(2); }
  monthLabel(){ const ms=this.monthSel(); if(ms.length===0)return 'All periods'; if(ms.length===1)return this.ml(ms[0]);
    const all=this.months(); const fys=[...new Set(ms.map(m=>this.fyOf(m)))].sort();
    const full=fys.every(f=>all.filter(m=>this.fyOf(m)===f).every(m=>ms.includes(m))) && ms.length===all.filter(m=>fys.includes(this.fyOf(m))).length;
    if(full) return fys.map(f=>this.fyLabel(f)).join(' + ');
    return ms.length+' months'; }
  toggleMonth(m){ const ms=this.monthSel().slice(); const i=ms.indexOf(m); if(i>=0)ms.splice(i,1); else ms.push(m); this.setState({months:ms}); }

  // ---------- format ----------
  inr(n){ n=Math.round(n||0); const neg=n<0; const s=String(Math.abs(n)); let l3=s.slice(-3), rest=s.slice(0,-3); rest=rest.replace(/\B(?=(\d{2})+(?!\d))/g,','); return (neg?'-':'')+'₹'+(rest?rest+',':'')+l3; }
  cr(n){ n=n||0; const a=Math.abs(n); if(a>=1e7) return '₹'+(n/1e7).toFixed(2)+' Cr'; if(a>=1e5) return '₹'+(n/1e5).toFixed(2)+' L'; return this.inr(n); }
  ml(ym){ const[y,m]=ym.split('-'); return MON[+m-1]+"'"+y.slice(2); }

  // ---------- agg helpers ----------
  groupSum(arr, keyFn){ const m={}; for(const x of arr){ const k=keyFn(x); if(k==null||k==='') continue; if(!m[k]) m[k]={key:k,count:0,spend:0,items:[]}; m[k].count++; m[k].spend+=(x.net||0); m[k].items.push(x); } return Object.values(m); }
  sum(arr,f){ return arr.reduce((a,b)=>a+(f?f(b):b),0); }
  avg(arr,f){ const v=arr.map(f).filter(x=>x!=null&&!isNaN(x)); return v.length? v.reduce((a,b)=>a+b,0)/v.length : 0; }

  // ============ UI PRIMITIVES ============
  h(){ return React.createElement.apply(null, arguments); }

  // click-to-reveal exact figures on any bar / pie segment
  isMoney(s){ return /₹|Cr| L\b|Lakh/.test(String(s||'')); }
  showTip(e, title, lines){ if(e&&e.stopPropagation)e.stopPropagation(); const x=(e&&e.clientX)||0,y=(e&&e.clientY)||0; this.setState({tip:{x,y,title,lines:[].concat(lines).filter(Boolean)}}); }
  renderTip(){
    const h=React.createElement; const t=this.state.tip; if(!t) return null;
    const vw=(typeof window!=='undefined'?window.innerWidth:1200), vh=(typeof window!=='undefined'?window.innerHeight:800);
    const left=Math.max(8,Math.min(t.x+14, vw-228)), top=Math.max(8,Math.min(t.y+14, vh-90));
    return h('div',null,
      h('div',{onClick:()=>this.setState({tip:null}),style:{position:'fixed',inset:0,zIndex:60}}),
      h('div',{style:{position:'fixed',left:left,top:top,zIndex:61,background:C.ink,color:'#fff',borderRadius:11,padding:'11px 14px',boxShadow:'0 12px 34px rgba(16,27,45,.34)',pointerEvents:'none',maxWidth:220}},
        h('div',{style:{fontSize:11.5,fontWeight:600,opacity:.85,marginBottom:t.lines.length?6:0,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},t.title),
        t.lines.map((l,i)=>h('div',{key:i,style:{fontFamily:C.mono,fontSize:14,fontWeight:600,lineHeight:1.4,whiteSpace:'nowrap'}},l))
      )
    );
  }
  // medium-width grid: 3-up on wide, 2-up on tablet, 1-up on mobile
  gx3(){ return this.mob()? '1fr' : (this.vwLive()<1180? '1fr 1fr' : '1fr 1fr 1fr'); }

  card(title, sub, body, extra){
    const h=React.createElement;
    return h('div',{'data-card':'1',style:Object.assign({background:'rgba(255,255,255,.8)',backdropFilter:'blur(12px)',WebkitBackdropFilter:'blur(12px)',borderRadius:14,padding:'18px 20px',border:'1px solid rgba(255,255,255,.6)',boxShadow:'0 1px 2px rgba(16,27,45,.05), 0 0 0 1px '+C.border}, extra&&extra.style)},

  cellVal(c,r){ const v=typeof c.k==='function'?c.k(r):r[c.k]; if(c.t==='inr'||c.t==='int') return (v===''||v==null)?'':Math.round(+v||0); return v==null?'':String(v); }

  async doExport(kind){

  async exportXlsx(title,sheets){
    await this.loadLib('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',()=>!!window.XLSX);
    const X=window.XLSX; const wb=X.utils.book_new(); const used={};
    sheets.forEach(s=>{
      const body=s.rows.map(r=>s.cols.map(c=>this.cellVal(c,r)));
      const hasSum=s.cols.some(c=>c.sum)&&body.length>1;
      const aoa=[s.cols.map(c=>c.h),...body]; if(hasSum) aoa.push(s.cols.map((c,i)=>i===0?'TOTAL':(c.sum?body.reduce((a,r)=>a+(+r[i]||0),0):'')));
      const ws=X.utils.aoa_to_sheet(aoa);
      for(let ri=1;ri<aoa.length;ri++) s.cols.forEach((c,ci)=>{ if(c.t==='inr'){ const cell=ws[X.utils.encode_cell({r:ri,c:ci})]; if(cell&&cell.t==='n') cell.z='#,##,##0'; } });
      ws['!cols']=s.cols.map((c,i)=>({wch:c.w||Math.min(40,Math.max(c.h.length+2,...body.slice(0,300).map(r=>String(r[i]).length+2)))}));
      if(body.length) ws['!autofilter']={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:body.length,c:s.cols.length-1}})};
      let nm=s.name.replace(/[\[\]\*\?\/\\:]/g,'').slice(0,31); if(used[nm]) nm=nm.slice(0,28)+' '+(++used[nm]); used[nm]=1;
      X.utils.book_append_sheet(wb,ws,nm);
    });
    const info=X.utils.aoa_to_sheet([['Report',title],['Source','IDCUBE Travel Spend Analyser'],['Filters',this.filterNote()],['Generated',this.fmtD(new Date().toISOString())],['Note','Bookings with multiple travellers / guests are split equally between them in per-person figures. Duplicate name spellings are merged into one traveller.']]);
    info['!cols']=[{wch:14},{wch:100}]; X.utils.book_append_sheet(wb,info,'Report Info');
    X.writeFile(wb,title+'.xlsx');
  }
  async exportPdf(title,sheets){
    await this.loadLib('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',()=>!!(window.jspdf&&window.jspdf.jsPDF));
    await this.loadLib('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js',()=>!!(window.jspdf.jsPDF.API&&window.jspdf.jsPDF.API.autoTable));
    const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'pt',format:'a4'}); const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(); const M=28;
    doc.setFillColor(15,23,38); doc.rect(0,0,W,64,'F');
    doc.setTextColor(154,168,188); doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.text('IDCUBE  ·  TRAVEL SPEND ANALYSER'.replace('·','-'),M,22);
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.text(title,M,46);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(154,168,188); doc.text('Generated '+this.fmtD(new Date().toISOString()),W-M,46,{align:'right'});
    doc.setTextColor(107,119,135); doc.setFontSize(8.5); doc.text(this.filterNote()+'  |  Shared bookings split equally per traveller',M,82);
    let y=100;
    sheets.forEach((s,si)=>{
      if(y>H-90){ doc.addPage(); y=40; }
      doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(15,27,45); doc.text(s.name+'  ('+s.rows.length+')',M,y); y+=8;
      const fmt=(c,v)=>(c.t==='inr'||c.t==='int')&&v!==''?this.numIN(v):String(v);
      const body=s.rows.map(r=>s.cols.map(c=>fmt(c,this.cellVal(c,r))));
      const hasSum=s.cols.some(c=>c.sum)&&s.rows.length>1;
      const foot=hasSum?[s.cols.map((c,i)=>i===0?'TOTAL':(c.sum?this.numIN(this.sum(s.rows,r=>+this.cellVal(c,r)||0)):''))]:undefined;
      const colStyles={}; s.cols.forEach((c,i)=>{ if(c.t==='inr'||c.t==='int') colStyles[i]={halign:'right'}; });
      const many=s.cols.length;
      doc.autoTable({startY:y,head:[s.cols.map(c=>c.h)],body:body.length?body:[[{content:'No records for the current filters',colSpan:many,styles:{halign:'center',textColor:[107,119,135]}}]],foot,showFoot:'lastPage',theme:'grid',margin:{left:M,right:M,top:36,bottom:34},
        styles:{font:'helvetica',fontSize:many>14?6.4:many>9?7.4:8.6,cellPadding:many>14?2.6:3.6,textColor:[15,27,45],lineColor:[226,231,238],lineWidth:.4,overflow:'linebreak',valign:'middle'},
        headStyles:{fillColor:[15,27,45],textColor:[255,255,255],fontStyle:'bold',halign:'left'},footStyles:{fillColor:[238,241,245],textColor:[15,27,45],fontStyle:'bold'},
        alternateRowStyles:{fillColor:[248,250,252]},columnStyles:colStyles,
        didParseCell:d=>{ if((d.section==='head'||d.section==='foot')&&colStyles[d.column.index]) d.cell.styles.halign='right'; }});
      y=doc.lastAutoTable.finalY+28;
    });
    const n=doc.getNumberOfPages();
    for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(154,166,181); doc.text(title+'  -  IDCUBE Travel Spend Analyser',M,H-16); doc.text('Page '+i+' of '+n,W-M,H-16,{align:'right'}); }
    doc.save(title+'.pdf');
  }

  view_actions(){

    if(scope==='dom'){ fAct=fAct.filter(a=>a.type==='Dom'); hAct=hAct.filter(a=>a.country==='India'); }
    if(scope==='intl'){ fAct=fAct.filter(a=>a.type==='Intl'); hAct=hAct.filter(a=>a.country&&a.country!=='India'); }
    if(this.q()){ fAct=fAct.filter(a=>this.matchQ(a,[a.traveller,a.airline,a.bookingId,a.pnr,a.from,a.to])); hAct=hAct.filter(a=>this.matchQ(a,[a.traveller,a.hotel,a.bookingId,a.pnr,a.city])); tAct=tAct.filter(a=>this.matchQ(a,[a.traveller,a.trainName,a.bookingId,a.pnr])); }
    const {flight,hotel,train}=this.filtered();
    const cf=flight.filter(f=>f.cancelled), ch=hotel.filter(x=>x.cancelled), ct=train.filter(x=>x.cancelled);
    const agg=rows=>{ const m={}; for(const r of rows){ if(!m[r.action])m[r.action]={count:0,net:0}; m[r.action].count++; m[r.action].net+=r.net; } return m; };
    const fA=agg(fAct), hA=agg(hAct), tA=agg(tAct);
    // economics of cancellation
    const fGross=this.sum(cf,f=>f.gross), fRef=-this.sum(cf,f=>f.refund), fLost=this.sum(cf,f=>f.net);
    const hGross=this.sum(ch,x=>x.gross), hRef=-this.sum(ch,x=>x.refund), hLost=this.sum(ch,x=>x.net);
