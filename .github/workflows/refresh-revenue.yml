name: Refresh revenue from Google Sheet

# Pulls the Revenue_r feed (IMPORTRANGE mirror of NRR Reports → Revenue_r), rebuilds the
# revenue register inside index.html, and publishes if anything changed.
on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours (UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-revenue
  cancel-in-progress: false

env:
  FEED_URL: https://docs.google.com/spreadsheets/d/1kw-1baC2kuHf8FHD0wIkkp2Xe9A7u427WV6MZWEIxlY/export?format=csv&gid=0

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download feed
        run: |
          code=$(curl -sL -o feed.csv -w '%{http_code}|%{content_type}' "$FEED_URL")
          echo "feed: $code, $(wc -l < feed.csv) lines"
          case "$code" in 200\|text/csv*) ;; *) echo "::error::Feed not readable as CSV ($code) — is the sheet still shared 'Anyone with the link'?"; exit 1;; esac

      - name: Rebuild revenue register
        run: node tools/build-revenue.js feed.csv . | tee build.log

      - name: Publish if changed
        run: |
          rm -f feed.csv
          if git diff --quiet -- index.html revenue-rows.js revenue-data.js; then
            echo "No change in the sheet — nothing to publish."; rm -f build.log; exit 0
          fi
          git config user.name  "revenue-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html revenue-rows.js revenue-data.js
          git commit -m "Revenue refresh from Google Sheet: $(head -1 build.log)"
          rm -f build.log
          git push
          # make sure Pages rebuilds even if the push itself does not trigger it
          curl -s -o /dev/null -w 'pages build request: %{http_code}\n' -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
